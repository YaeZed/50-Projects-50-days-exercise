<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Carousel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="carousel">
      <div class="image-container" id="imgs">
        <img
          src="/50Projects_exercise/assets/McLarenSnow.PNG"
          alt="first-image"
        />
        <img src="/50Projects_exercise/assets/Fall.PNG" alt="second-image" />
        <img src="/50Projects_exercise/assets/wildHe.PNG" alt="third-image" />
        <img
          src="/50Projects_exercise/assets/koenigsegg.PNG"
          alt="fourth-image"
        />
      </div>

      <div class="buttons-container">
        <button id="left" class="btn">Prev</button>
        <button id="right" class="btn">Next</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
